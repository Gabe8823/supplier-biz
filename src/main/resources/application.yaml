server:
  port: 8080

spring:
  # 本地开发配置（密码、密钥等）放在 application-local.yaml，已被 .gitignore 忽略
  config:
    import: optional:classpath:application-local.yaml
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: 5672
    username: admin
    # 密码只从环境变量或 application-local.yaml 读取，仓库不含默认口令
    password: ${MQ_PASSWORD}
    # 开启生产者 confirm 模式（Broker 收到消息后回调）
    publisher-confirm-type: correlated
    # 开启 returns 模式（路由失败时回调，防消息丢失）
    publisher-returns: true
  application:
    name: supplier-biz
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval=true：MySQL 9.x 的 caching_sha2_password 在
    # useSSL=false 时必须取服务端 RSA 公钥来加密密码，否则报
    # "Public Key Retrieval is not allowed"。密码缓存是内存态，MySQL 重启后
    # 缓存清空即会暴露此问题，故必须显式开启（本地连接无中间人风险）。
    url: jdbc:mysql://localhost:3306/supplier_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 密码只从环境变量或 application-local.yaml 读取
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      # 本地 Redis 无密码；若启用密码，在本文件补充 password 配置
      database: 0
      timeout: 3000ms
jwt:
  # 签名密钥只从环境变量或 application-local.yaml 读取，长度至少 32 字节
  secret: ${JWT_SECRET}
  expiration: 86400000
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.sup.supplierbiz.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: ZH_CN

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations:
    - classpath*:/mapper/**/*.xml

