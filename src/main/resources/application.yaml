server:
  port: 8080

spring:
  application:
    name: supplier-biz
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/supplier_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: localhost
      port: 6379
      # 本地 Redis 无密码；生产通过环境变量 REDIS_PASSWORD 注入
      database: 0
      timeout: 3000ms
jwt:
  # 生产环境通过环境变量 JWT_SECRET 注入；此处为本地开发默认值，非生产密钥
  secret: ${JWT_SECRET:dev-only-0123456789abcdef0123456789abcdef}
  expiration: 86400000
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.sup.supplierbiz.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: ZH_CN

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations:
    - classpath*:/mapper/**/*.xml

